[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-llm-gateway"
version = "0.1.0"
description = "Policy-controlled LLM gateway with deterministic fallback and metadata-only auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
local = [
    "chromadb>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "mock_provider*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]